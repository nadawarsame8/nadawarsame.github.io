cd /workspaces/nadawarsame.github.io

git show HEAD^:_includes/head/custom.html > _includes/head/custom.html

cat >> _includes/head/custom.html <<'EOF'

<style>
:root {
  --navy: #1D3557;
  --off-white: #FAFAFA;
  --berry: #A83979;
}

html, body {
  background: var(--off-white) !important;
  color: var(--navy) !important;
}

h1, h2, h3, h4, h5, h6 {
  color: var(--navy) !important;
}

.masthead, .greedy-nav, .page__footer {
  background: var(--navy) !important;
}

a, .archive__item-title a {
  color: var(--berry) !important;
}

button, .btn, input[type="submit"] {
  background: var(--berry) !important;
  border-color: var(--berry) !important;
  color: #fff !important;
}

button:hover, .btn:hover, input[type="submit"]:hover {
  background: var(--navy) !important;
  border-color: var(--navy) !important;
}

* {
  text-shadow: none !important;
  box-shadow: none !important;
}
</style>
EOF

git add _includes/head/custom.html
git commit -m "Preserve site assets and update colours"
git push
